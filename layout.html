<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block titulo %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script>
        (function () {
            var temaSalvo = localStorage.getItem("tema") || "roxo";
            document.documentElement.setAttribute("data-tema", temaSalvo);
        })();
    </script>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            💰 Gerenciador de Despesas
        </a>

        <div class="dropdown">

            <button
                class="btn btn-light dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false">

                <i class="bi bi-palette"></i> Tema

            </button>

            <ul class="dropdown-menu dropdown-menu-end">

                <li>
                    <a class="dropdown-item" href="#" onclick="selecionarTema('roxo'); return false;">
                        🟣 Roxo Moderno
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="#" onclick="selecionarTema('azul'); return false;">
                        🔵 Azul Escuro
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="#" onclick="selecionarTema('dourado'); return false;">
                        ⚫ Preto + Dourado
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="#" onclick="selecionarTema('verde'); return false;">
                        🌿 Verde Financeiro
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080">

    <div id="toastSucesso" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastMensagem"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>

</div>

<div class="container mt-4">

    {% block conteudo %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script src="{{ url_for('static', filename='script.js') }}"></script>

{% block script_extra %}{% endblock %}

</body>

</html>
